services:
  api:
    build: .
    env_file: .env
    command: ["polymarket-lab", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - trading_data:/app/data
    restart: unless-stopped

  paper-worker:
    build: .
    env_file: .env
    command: ["polymarket-lab", "paper-worker"]
    volumes:
      - trading_data:/app/data
    restart: unless-stopped

volumes:
  trading_data:
