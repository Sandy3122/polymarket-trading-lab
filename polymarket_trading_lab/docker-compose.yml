# One-command run:  docker compose up -d   ->  http://localhost:8000
# Optional: create .env.docker (see .env.example for keys) to override limits
# or set DATABASE_URL to PostgreSQL. Not required. The local-dev .env is ignored.
x-lab: &lab
  build: .
  image: ${LAB_IMAGE:-polymarket-trading-lab:latest}
  env_file:
    - path: .env.docker
      required: false
  # Default DB (SQLite) lives on the named volume, set in the Dockerfile.
  volumes:
    - trading_data:/app/data
  restart: unless-stopped

services:
  api:
    <<: *lab
    ports:
      - "${PORT:-8000}:8000"

  paper-worker:
    <<: *lab
    command: ["polymarket-lab", "paper-worker"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  trading_data:
